name: Backend Continuous Integration
on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - 'backend/**'
  workflow_dispatch:
jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip; pip install pipenv
      - run: cd starter/backend 2>/dev/null || cd backend; pipenv install --dev
      - run: cd starter/backend 2>/dev/null || cd backend; pipenv run lint
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip; pip install pipenv
      - run: cd starter/backend 2>/dev/null || cd backend; pipenv install --dev
      - run: cd starter/backend 2>/dev/null || cd backend; pipenv run test
  build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: cd starter/backend 2>/dev/null || cd backend; docker build --tag mp-backend:latest .